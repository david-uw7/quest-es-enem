<!DOCTYPE html>
    <html lang ="PT-BR">
<head>
    
    <meta charset ="UTF-8">
    <title>Enigma - Login</title>
<link rel="stylesheet" href="/CSS/style.css">
<link rel= "icon" type = "png" href="/ASSETS/ICONS/logo_Enigma.png">
</head>
<body>
<header class="navbar">

  <!-- Lado Esquerdo: Logo e Nome da Marca -->
  <div class="brand">
    <img id="logoEnigma" class="logoEnigma" src="/ASSETS/ICONS/logo_Enigma.png" alt="Logo Enigma">
    <span class="brand-name">Eᥒιg꧑ᥲ</span>
  </div>

  <!-- Lado Direito: Links e Botões de Ação -->
  <nav id="menuEntrar">
    <a class ="home" href="/HTML/HOMESPACE/index.html">⮌ VOLTAR</a>
  </nav>
</header>

<!-- Título e Container do Formulário de Login -->
<div id="conteiner-entrar"> 
  <div class="cardEntrar">
    <p class="bemVindo">Bem Vindo De Volta!</p>
    <h1>Entrar</h1>

    <form class="login-form" onsubmit="event.preventDefault();">
      <!-- Espaço de Digitar as Informações do Usuário -->
      <div class="input-group">
        <input id="botoes1" type="text" placeholder="Digite o Nome ou E-mail" required>
      </div>

      <!-- Espaço de Digitar a Senha do Usuário -->
      <div class="input-group">
        <input id="botoes2" type="password" placeholder="Digite sua senha" required>
      </div>

      <a class="esSenha">Esqueceu a senha?</a>

      <!-- Botão de Entrar -->
      <button type="submit" id="btnEntrarLogin">Entrar</button>
    </form>

    <!-- Rodapé do Card -->
    <div id="rodape">
      <p>Novo por aqui? <a href="/HTML/HOMESPACE/PAGES/cadastrar.html" class="color">Criar uma conta</a></p>
    </div>
  </div>
</div>

    <script src="/JS/script.js"></script>
</body>
    </html>
